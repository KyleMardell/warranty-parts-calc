<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.E.R Calculator</title>

    <!-- Bootstrap Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <section class="container">
        <div class="row my-5">
            <div class="col">
                <div class="d-flex justify-content-center ber-logo-wrapper">
                    <img src="media/ber.png" alt="Logo" class="ber-logo">
                    <h1 class="text-center">B.E.R Calculator</h1>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col col-12 col-md-6 col-lg-4 main-box">
                <div class="row">
                    <div class="col">
                        <form class="calc-form my-3" id="ber-form">

                            <!-- Vehicle Value -->
                            <div class="input-group mb-3">
                                <span class="input-group-text">Vehicle Value:</span>
                                <input type="number" id="vehicleValue" step="0.01" min="0" placeholder="0.00"
                                    class="form-control" required>
                            </div>

                            <!-- Salvage Costs -->
                            <div class="input-group mb-3">
                                <span class="input-group-text">Salvage Costs:</span>
                                <input type="number" id="salvageCosts" step="0.01" min="0" placeholder="0.00"
                                    class="form-control" required>
                            </div>

                            <!-- Policy -->
                            <div class="input-group mb-3">
                                <span class="input-group-text">Policy:</span>

                                <input type="radio" class="btn-check" name="policyType" id="approved" checked>
                                <label class="btn policy-check" for="approved">Approved</label>

                                <input type="radio" class="btn-check" name="policyType" id="extended">
                                <label class="btn policy-check" for="extended">Extended / All In</label>
                            </div>

                            <!-- Extended Inputs -->
                            <div id="extended-inputs">
                                <div class="input-group mb-3">
                                    <span class="input-group-text">Excess:</span>

                                    <input type="radio" class="btn-check" name="excessAmount" id="excess-0" checked>
                                    <label class="btn excess-check" for="excess-0">No Excess</label>

                                    <input type="radio" class="btn-check" name="excessAmount" id="excess-100">
                                    <label class="btn excess-check" for="excess-100">£100</label>

                                    <input type="radio" class="btn-check" name="excessAmount" id="excess-250">
                                    <label class="btn excess-check" for="excess-250">£250</label>
                                </div>

                                <div class="input-group mb-3">
                                    <span class="input-group-text">Remaining Payment:</span>
                                    <input type="number" id="remainingPayment" step="0.01" min="0" placeholder="0.00"
                                        class="form-control">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-secondary w-50">Calculate</button>
                        </form>
                    </div>
                </div>

                <!-- Results (always visible) -->
                <div class="row mt-5">
                    <div class="col">
                        <div class="card" id="result-card">
                            <div class="card-header text-center">
                                <h2>Result</h2>
                            </div>
                            <div class="card-body text-center">
                                <h3 class="my-4">
                                    Amount to customer:
                                    £<span id="result-to-customer">0.00</span>
                                </h3>
                                <p>Amount on claim: £<span id="result-on-claim">0.00</span></p>
                                <p>VAT on claim: £<span id="vat-amount">0.00</span></p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="row m-5">
            <div class="col text-center">
                <a href="index.html" class="btn btn-secondary w-25 mt-3">Parts Calculator</a>
            </div>
        </div>
    </section>

    <!-- Bootstrap Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

    <!-- Custom Script -->
    <script src="assets/js/berscript.js"></script>
</body>

</html>
